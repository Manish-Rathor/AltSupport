<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira Board Dashboard - Alt Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --light: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 20px;
        }

        .dashboard {
            max-width: 1800px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 40px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(139, 92, 246, 0.1) 100%);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc 0%, #c4b5fd 50%, #f0abfc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Filters Section */
        .filters-section {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .filters-title {
            color: #f8fafc;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            color: #cbd5e1;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select {
            width: 100%;
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
        }

        /* Select2 Custom Styling */
        .select2-container--default .select2-selection--multiple {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 10px !important;
            padding: 5px 10px !important;
            min-height: 45px !important;
        }

        .select2-container--default .select2-selection--multiple .select2-selection__choice {
            background: var(--primary) !important;
            border: none !important;
            color: white !important;
            border-radius: 6px !important;
            padding: 5px 10px !important;
            margin: 3px !important;
        }

        .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
            color: white !important;
            margin-right: 5px !important;
        }

        .select2-container--default .select2-selection--multiple .select2-selection__placeholder {
            color: #94a3b8 !important;
        }

        .select2-dropdown {
            background: #1e293b !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 10px !important;
        }

        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background: var(--primary) !important;
        }

        .select2-container--default .select2-results__option {
            color: #e2e8f0 !important;
        }

        .select2-container--default .select2-search--dropdown .select2-search__field {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #e2e8f0 !important;
            border-radius: 8px !important;
        }

        .filter-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Stats Section */
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .stat-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-bottom: 15px;
            background: rgba(99, 102, 241, 0.2);
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: #f8fafc;
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Tickets Grid */
        .tickets-section {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .tickets-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .tickets-title {
            color: #f8fafc;
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ticket-count {
            background: var(--primary);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .tickets-grid {
            display: grid;
            gap: 15px;
        }

        .ticket-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .ticket-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            transform: translateX(5px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .ticket-key {
            color: var(--primary);
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            padding: 6px 12px;
            background: rgba(99, 102, 241, 0.15);
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .ticket-key:hover {
            background: rgba(99, 102, 241, 0.25);
            transform: scale(1.05);
        }

        .ticket-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-type {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
        }

        .badge-priority {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .badge-status {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }

        .ticket-title {
            color: #f8fafc;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .ticket-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .ticket-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .ticket-components {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .component-tag {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Loading and Empty States */
        .loading {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-message {
            font-size: 1.2rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
        }

        .pagination-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #e2e8f0;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination-btn:hover:not(:disabled) {
            background: var(--primary);
            border-color: var(--primary);
        }

        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination-info {
            color: #cbd5e1;
            font-weight: 600;
            padding: 0 15px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .filters-grid {
                grid-template-columns: 1fr;
            }

            .stats-section {
                grid-template-columns: repeat(2, 1fr);
            }

            .ticket-header {
                flex-direction: column;
                gap: 10px;
            }

            .ticket-meta {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🎯 Jira Board Dashboard</h1>
            <p>Multi-filter Ticket Management System</p>
        </div>

        <!-- Filters Section -->
        <div class="filters-section">
            <div class="filters-title">
                🔍 Filters
            </div>
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="projectFilter">Project</label>
                    <select id="projectFilter" class="multi-select" multiple="multiple">
                        <option value="SUPPORT">SUPPORT</option>
                        <option value="BUG">BUG</option>
                        <option value="STORY">STORY</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="typeFilter">Type</label>
                    <select id="typeFilter" class="multi-select" multiple="multiple">
                        <option value="Bug">Bug</option>
                        <option value="Story">Story</option>
                        <option value="Task">Task</option>
                        <option value="Epic">Epic</option>
                        <option value="Sub-task">Sub-task</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="componentFilter">Component</label>
                    <select id="componentFilter" class="multi-select" multiple="multiple">
                        <!-- Will be populated dynamically -->
                    </select>
                </div>

                <div class="filter-group">
                    <label for="statusFilter">Status</label>
                    <select id="statusFilter" class="multi-select" multiple="multiple">
                        <option value="To Do">To Do</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Done">Done</option>
                        <option value="Closed">Closed</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>
            </div>

            <div class="filter-actions">
                <button class="btn btn-primary" onclick="applyFilters()">
                    ✨ Apply Filters
                </button>
                <button class="btn btn-secondary" onclick="resetFilters()">
                    🔄 Reset
                </button>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="stats-section" id="statsSection">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="totalTickets">0</div>
                <div class="stat-label">Total Tickets</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔴</div>
                <div class="stat-value" id="openTickets">0</div>
                <div class="stat-label">Open</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="resolvedTickets">0</div>
                <div class="stat-label">Resolved</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🚀</div>
                <div class="stat-value" id="inProgressTickets">0</div>
                <div class="stat-label">In Progress</div>
            </div>
        </div>

        <!-- Tickets Section -->
        <div class="tickets-section">
            <div class="tickets-header">
                <div class="tickets-title">
                    📋 Tickets
                    <span class="ticket-count" id="ticketCount">0</span>
                </div>
            </div>
            <div id="ticketsContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div>Loading tickets...</div>
                </div>
            </div>
            <div class="pagination" id="paginationContainer" style="display: none;">
                <button class="pagination-btn" id="prevBtn" onclick="previousPage()" disabled>← Previous</button>
                <span class="pagination-info" id="pageInfo">Page 1 of 1</span>
                <button class="pagination-btn" id="nextBtn" onclick="nextPage()" disabled>Next →</button>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let currentPage = 1;
        let totalPages = 1;
        let pageSize = 20;
        let allTickets = [];
        let filteredTickets = [];
        let availableComponents = new Set();

        // Initialize Select2
        $(document).ready(function() {
            $('.multi-select').select2({
                placeholder: 'Select options',
                allowClear: true,
                width: '100%'
            });

            // Load initial data
            loadAllComponents();
            loadTickets();

            // Listen for project and type changes to update components
            $('#projectFilter, #typeFilter').on('change', function() {
                updateComponentFilter();
            });
        });

        // Load all available components
        async function loadAllComponents() {
            try {
                const components = [
                    'Bones', 'Brahmaputra', 'Ganga', 'Godavari', 
                    'Kali', 'Krishna', 'Mandovi', 'None'
                ];

                const componentSelect = $('#componentFilter');
                componentSelect.empty();
                
                components.forEach(component => {
                    componentSelect.append(new Option(component, component, false, false));
                });
                
                componentSelect.trigger('change');
            } catch (error) {
                console.error('Error loading components:', error);
            }
        }

        // Update component filter based on selected projects and types
        async function updateComponentFilter() {
            const selectedProjects = $('#projectFilter').val() || [];
            const selectedTypes = $('#typeFilter').val() || [];

            if (selectedProjects.length === 0 && selectedTypes.length === 0) {
                return;
            }

            try {
                // Build JQL query
                const jqlParts = [];
                
                if (selectedProjects.length > 0) {
                    jqlParts.push(`project IN (${selectedProjects.map(p => `"${p}"`).join(', ')})`);
                }
                
                if (selectedTypes.length > 0) {
                    jqlParts.push(`type IN (${selectedTypes.map(t => `"${t}"`).join(', ')})`);
                }

                const jql = jqlParts.join(' AND ');
                
                // Fetch tickets to get unique components
                const response = await fetch(`/api/tickets/search/jql?jql=${encodeURIComponent(jql)}&maxResults=1000`);
                
                if (response.ok) {
                    const data = await response.json();
                    const tickets = data.tickets || [];
                    
                    // Extract unique components
                    const components = new Set();
                    tickets.forEach(ticket => {
                        if (ticket.components && Array.isArray(ticket.components)) {
                            ticket.components.forEach(comp => components.add(comp));
                        }
                    });

                    // Update component dropdown
                    const componentSelect = $('#componentFilter');
                    const selectedComponents = componentSelect.val() || [];
                    componentSelect.empty();
                    
                    Array.from(components).sort().forEach(component => {
                        componentSelect.append(new Option(component, component, false, selectedComponents.includes(component)));
                    });
                    
                    componentSelect.trigger('change');
                }
            } catch (error) {
                console.error('Error updating components:', error);
            }
        }

        // Load tickets with filters
        async function loadTickets() {
            try {
                showLoading();
                
                // For now, load from the local database
                // You can modify this to use the Jira API directly
                const response = await fetch(`/api/tickets?page=${currentPage}&pageSize=1000`);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch tickets');
                }

                const tickets = await response.json();
                allTickets = tickets;
                
                applyFilters();
            } catch (error) {
                console.error('Error loading tickets:', error);
                showError('Failed to load tickets. Please try again.');
            }
        }

        // Apply filters to tickets
        function applyFilters() {
            const selectedProjects = $('#projectFilter').val() || [];
            const selectedTypes = $('#typeFilter').val() || [];
            const selectedComponents = $('#componentFilter').val() || [];
            const selectedStatuses = $('#statusFilter').val() || [];

            filteredTickets = allTickets.filter(ticket => {
                // Project filter
                if (selectedProjects.length > 0 && !selectedProjects.includes(ticket.projectKey)) {
                    return false;
                }

                // Type filter
                if (selectedTypes.length > 0 && !selectedTypes.includes(ticket.ticketType)) {
                    return false;
                }

                // Component filter
                if (selectedComponents.length > 0) {
                    const hasMatchingComponent = ticket.components && 
                        ticket.components.some(comp => selectedComponents.includes(comp));
                    if (!hasMatchingComponent) {
                        return false;
                    }
                }

                // Status filter
                if (selectedStatuses.length > 0 && !selectedStatuses.includes(ticket.status)) {
                    return false;
                }

                return true;
            });

            currentPage = 1;
            updateStats();
            displayTickets();
        }

        // Reset all filters
        function resetFilters() {
            $('#projectFilter').val(null).trigger('change');
            $('#typeFilter').val(null).trigger('change');
            $('#componentFilter').val(null).trigger('change');
            $('#statusFilter').val(null).trigger('change');
            
            loadAllComponents();
            applyFilters();
        }

        // Update statistics
        function updateStats() {
            const total = filteredTickets.length;
            const open = filteredTickets.filter(t => 
                t.status !== 'Done' && t.status !== 'Closed' && t.status !== 'Resolved'
            ).length;
            const resolved = filteredTickets.filter(t => 
                t.status === 'Done' || t.status === 'Closed' || t.status === 'Resolved'
            ).length;
            const inProgress = filteredTickets.filter(t => 
                t.status === 'In Progress'
            ).length;

            document.getElementById('totalTickets').textContent = total;
            document.getElementById('openTickets').textContent = open;
            document.getElementById('resolvedTickets').textContent = resolved;
            document.getElementById('inProgressTickets').textContent = inProgress;
            document.getElementById('ticketCount').textContent = total;
        }

        // Display tickets
        function displayTickets() {
            const container = document.getElementById('ticketsContainer');
            
            if (filteredTickets.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-message">No tickets found</div>
                        <p style="margin-top: 10px; color: #64748b;">Try adjusting your filters</p>
                    </div>
                `;
                document.getElementById('paginationContainer').style.display = 'none';
                return;
            }

            // Pagination
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const paginatedTickets = filteredTickets.slice(start, end);
            totalPages = Math.ceil(filteredTickets.length / pageSize);

            // Render tickets
            const ticketsHTML = paginatedTickets.map(ticket => `
                <div class="ticket-card" onclick="openTicket('${ticket.ticketKey}')">
                    <div class="ticket-header">
                        <a href="https://navex.atlassian.net/browse/${ticket.ticketKey}" 
                           target="_blank" 
                           class="ticket-key"
                           onclick="event.stopPropagation()">
                            ${ticket.ticketKey}
                        </a>
                        <div class="ticket-badges">
                            <span class="badge badge-type">${ticket.ticketType || 'Unknown'}</span>
                            ${ticket.priority ? `<span class="badge badge-priority">${ticket.priority}</span>` : ''}
                            <span class="badge badge-status">${ticket.status || 'Unknown'}</span>
                        </div>
                    </div>
                    <div class="ticket-title">${ticket.title || 'No title'}</div>
                    <div class="ticket-meta">
                        <div class="ticket-meta-item">
                            📁 <strong>${ticket.projectKey || 'N/A'}</strong>
                        </div>
                        <div class="ticket-meta-item">
                            👤 ${ticket.assignee || 'Unassigned'}
                        </div>
                        <div class="ticket-meta-item">
                            📅 ${formatDate(ticket.createdDate)}
                        </div>
                    </div>
                    ${ticket.components && ticket.components.length > 0 ? `
                        <div class="ticket-components">
                            ${ticket.components.map(comp => `
                                <span class="component-tag">${comp}</span>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');

            container.innerHTML = `<div class="tickets-grid">${ticketsHTML}</div>`;

            // Update pagination
            updatePagination();
        }

        // Update pagination controls
        function updatePagination() {
            const paginationContainer = document.getElementById('paginationContainer');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pageInfo = document.getElementById('pageInfo');

            if (totalPages <= 1) {
                paginationContainer.style.display = 'none';
                return;
            }

            paginationContainer.style.display = 'flex';
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
            pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
        }

        // Pagination functions
        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                displayTickets();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                displayTickets();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Open ticket in new tab
        function openTicket(ticketKey) {
            window.open(`https://navex.atlassian.net/browse/${ticketKey}`, '_blank');
        }

        // Format date
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        // Show loading state
        function showLoading() {
            const container = document.getElementById('ticketsContainer');
            container.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div>Loading tickets...</div>
                </div>
            `;
        }

        // Show error state
        function showError(message) {
            const container = document.getElementById('ticketsContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">⚠️</div>
                    <div class="empty-message">${message}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
