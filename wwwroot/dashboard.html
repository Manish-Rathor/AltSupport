<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Level Dashboard - Alt Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --light: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .dashboard {
            max-width: 1600px;
            margin: 0 auto;
            padding: 30px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(139, 92, 246, 0.1) 100%);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc 0%, #c4b5fd 50%, #f0abfc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.15rem;
            font-weight: 500;
        }

        .header-nav {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .nav-link {
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #e2e8f0;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: rgba(99, 102, 241, 0.3);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .nav-link.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* Filters */
        .filters {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: nowrap;
        }

        #customDateRange {
            gap: 8px;
            min-width: max-content;
            flex-wrap: nowrap;
        }

        #customDateRange[style*="display: block"],
        #customDateRange[style*="display: inline-flex"] {
            display: inline-flex !important;
        }

        #customDateRange label {
            margin: 0;
            white-space: nowrap;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        #customDateRange input[type="date"] {
            width: 130px;
            flex-shrink: 0;
            font-size: 0.85rem;
        }

        #customDateRange .refresh-btn {
            padding: 10px 16px;
            white-space: nowrap;
            flex-shrink: 0;
            min-width: auto;
            font-size: 0.85rem;
        }

        .filter-group label {
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            font-size: 0.9rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
        }

        .filter-group select option {
            background: rgba(30, 41, 59, 0.98);
            color: #e2e8f0;
            padding: 8px;
        }

        .filter-group select option:hover {
            background: rgba(99, 102, 241, 0.2);
        }

        .filter-group select:focus,
        .filter-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        input[type="date"] {
            padding: 10px 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            color-scheme: dark;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            color: #ffffff;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(1) brightness(2);
            opacity: 1;
        }
        
        input[type="date"]:hover::-webkit-calendar-picker-indicator {
            filter: invert(1) brightness(2.5);
        }

        input[type="date"]::-webkit-datetime-edit {
            color: #f8fafc;
        }

        input[type="date"]::-webkit-datetime-edit-fields-wrapper {
            color: #f8fafc;
        }

        input[type="date"]::-webkit-datetime-edit-text {
            color: #94a3b8;
        }

        input[type="date"]::-webkit-datetime-edit-month-field,
        input[type="date"]::-webkit-datetime-edit-day-field,
        input[type="date"]::-webkit-datetime-edit-year-field {
            color: #f8fafc;
        }

        .refresh-btn {
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        @media (max-width: 1200px) {
            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }
        }

        .summary-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            border-radius: 20px;
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .summary-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .summary-card.total {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.15) 100%);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .summary-card.open {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2) 0%, rgba(220, 38, 38, 0.15) 100%);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .summary-card.resolved {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(5, 150, 105, 0.15) 100%);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .summary-card.rate {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2) 0%, rgba(217, 119, 6, 0.15) 100%);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .summary-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 18px;
        }

        .summary-card.total .summary-icon { background: rgba(99, 102, 241, 0.3); }
        .summary-card.open .summary-icon { background: rgba(239, 68, 68, 0.3); }
        .summary-card.resolved .summary-icon { background: rgba(16, 185, 129, 0.3); }
        .summary-card.rate .summary-icon { background: rgba(245, 158, 11, 0.3); }

        .summary-card.clickable {
            cursor: pointer;
            position: relative;
        }

        .summary-card.clickable:hover {
            transform: translateY(-8px) scale(1.02);
        }

        .click-hint {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .summary-card.clickable:hover .click-hint {
            opacity: 1;
        }

        .summary-value {
            font-size: 2.8rem;
            font-weight: 800;
            color: #f8fafc;
            line-height: 1;
            margin-bottom: 8px;
        }

        .summary-label {
            font-size: 0.95rem;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Teams Grid (Categories) */
        .teams-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        .team-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
        }

        .team-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        }

        .team-card-header {
            padding: 24px 24px 20px;
            position: relative;
            overflow: hidden;
        }

        .team-card:nth-child(1) .team-card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .team-card:nth-child(2) .team-card-header { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .team-card:nth-child(3) .team-card-header { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .team-card:nth-child(4) .team-card-header { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .team-card:nth-child(5) .team-card-header { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .team-card:nth-child(6) .team-card-header { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
        .team-card:nth-child(7) .team-card-header { background: linear-gradient(135deg, #5ee7df 0%, #b490ca 100%); }
        .team-card:nth-child(8) .team-card-header { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .team-card:nth-child(9) .team-card-header { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); }
        .team-card:nth-child(10) .team-card-header { background: linear-gradient(135deg, #fdcbf1 0%, #e6dee9 100%); }

        .team-card-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            pointer-events: none;
        }

        .team-name {
            font-size: 1.35rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1;
        }

        .team-component {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.85);
            font-weight: 500;
            margin-top: 5px;
            position: relative;
            z-index: 1;
        }

        .team-card-body {
            padding: 24px;
        }

        .bug-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 16px 10px;
            background: var(--light);
            border-radius: 14px;
            transition: all 0.3s ease;
        }

        .stat-item.clickable {
            cursor: pointer;
        }

        .stat-item:hover {
            background: #e2e8f0;
            transform: scale(1.05);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 6px;
        }

        .stat-item.total .stat-value { color: var(--primary); }
        .stat-item.open .stat-value { color: var(--danger); }
        .stat-item.resolved .stat-value { color: var(--success); }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* Progress Bar */
        .resolution-progress {
            margin-top: 5px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .progress-value {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--success);
        }

        .progress-bar {
            height: 10px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success) 0%, #34d399 100%);
            border-radius: 10px;
            transition: width 1s ease-out;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* View Details Button */
        .view-details-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .view-details-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        /* Loading State */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            color: #94a3b8;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Error State */
        .error-container {
            text-align: center;
            padding: 60px 20px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .error-message {
            color: #fca5a5;
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .footer a {
            color: #a5b4fc;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .team-card {
            animation: fadeIn 0.6s ease-out backwards;
        }

        .team-card:nth-child(1) { animation-delay: 0.1s; }
        .team-card:nth-child(2) { animation-delay: 0.15s; }
        .team-card:nth-child(3) { animation-delay: 0.2s; }
        .team-card:nth-child(4) { animation-delay: 0.25s; }
        .team-card:nth-child(5) { animation-delay: 0.3s; }
        .team-card:nth-child(6) { animation-delay: 0.35s; }
        .team-card:nth-child(7) { animation-delay: 0.4s; }

        /* Timestamp */
        .timestamp {
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 30px;
        }

        .timestamp strong {
            color: #94a3b8;
        }

        /* Chart Section */
        .charts-section {
            margin-bottom: 40px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 24px;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .chart-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--light);
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-filter {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-filter label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .chart-filter select {
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.85rem;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .chart-filter select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .chart-container {
            position: relative;
            height: 350px;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .chart-card-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .chart-container {
                height: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <h1>📊 Application Level Dashboard</h1>
            <p>Real-time bug tracking and resolution metrics across all categories</p>
            <nav class="header-nav">
                <a href="index.html" class="nav-link">🔍 Ticket Search</a>
                <a href="dashboard.html" class="nav-link active">📊 App Dashboard</a>
                <a href="team-dashboard.html" class="nav-link">👥 CMI Teams</a>
                <a href="release-branch-dashboard.html" class="nav-link">🚀 Release & Patch</a>
                <a href="ethicspoint-dashboard.html" class="nav-link">🛡️ SusEng Kaveri</a>
            </nav>
        </header>

        <div class="filters">
            <div class="filter-group">
                <label for="daysFilter">📅 Time Range:</label>
                <select id="daysFilter">
                    <option value="7" selected>Last 7 Days</option>
                    <option value="14">Last 14 Days</option>
                    <option value="30" selected>Last 30 Days</option>
                    <option value="60">Last 60 Days</option>
                    <option value="90">Last 90 Days</option>
                    <option value="180">Last 6 Months</option>
                    <option value="365">Last Year</option>
                    <option value="custom">Custom Date Range</option>
                </select>
            </div>
            <div class="filter-group" id="customDateRange" style="display: none;">
                <label for="startDate">From:</label>
                <input type="date" id="startDate" />
                <label for="endDate">To:</label>
                <input type="date" id="endDate" />
                <button id="applyDateBtn" class="refresh-btn">
                    <span>✓</span> Apply
                </button>
            </div>
            <button id="refreshBtn" class="refresh-btn">
                <span>🔄</span> Refresh Data
            </button>
        </div>

        <div id="timestamp" class="timestamp"></div>

        <div id="content">
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <div class="loading-text">Loading dashboard statistics...</div>
            </div>
        </div>

        <footer class="footer">
            <p>Built with ❤️ for Alt Support | <a href="/swagger">API Documentation</a></p>
        </footer>
    </div>

    <script>
        class ApplicationDashboard {
            constructor() {
                this.contentEl = document.getElementById('content');
                this.timestampEl = document.getElementById('timestamp');
                this.daysFilter = document.getElementById('daysFilter');
                this.refreshBtn = document.getElementById('refreshBtn');
                this.customDateRange = document.getElementById('customDateRange');
                this.startDateInput = document.getElementById('startDate');
                this.endDateInput = document.getElementById('endDate');
                this.applyDateBtn = document.getElementById('applyDateBtn');
                
                this.data = null;
                
                // Chart instances
                this.categoryChart = null;
                this.openVsResolvedChart = null;
                
                this.init();
            }

            init() {
                this.refreshBtn.addEventListener('click', () => this.loadData(true)); // Force refresh on manual refresh
                this.daysFilter.addEventListener('change', () => {
                    if (this.daysFilter.value === 'custom') {
                        this.customDateRange.style.display = 'inline-flex';
                        // Set default dates (last 30 days to today)
                        const endDate = new Date();
                        const startDate = new Date();
                        startDate.setDate(startDate.getDate() - 30);
                        this.endDateInput.value = endDate.toISOString().split('T')[0];
                        this.startDateInput.value = startDate.toISOString().split('T')[0];
                    } else {
                        this.customDateRange.style.display = 'none';
                        this.loadData(); // Use cache when changing date range
                    }
                });
                this.applyDateBtn.addEventListener('click', () => this.loadData()); // Use cache on apply
                
                // Load data on page load
                this.loadData();
                
                // Auto-refresh every 5 minutes
                setInterval(() => this.loadData(), 5 * 60 * 1000);
            }

            async loadData(forceRefresh = false) {
                try {
                    this.showLoading();
                    this.refreshBtn.disabled = true;
                    
                    const params = new URLSearchParams();
                    
                    const daysBack = this.daysFilter.value;
                    if (daysBack === 'custom') {
                        // Use custom date range
                        if (this.startDateInput.value && this.endDateInput.value) {
                            params.append('startDate', this.startDateInput.value);
                            params.append('endDate', this.endDateInput.value);
                        }
                    } else if (daysBack) {
                        const endDate = new Date();
                        const startDate = new Date();
                        startDate.setDate(startDate.getDate() - parseInt(daysBack));
                        params.append('startDate', startDate.toISOString().split('T')[0]);
                        params.append('endDate', endDate.toISOString().split('T')[0]);
                    }
                    
                    // Add forceRefresh parameter to bypass cache
                    if (forceRefresh) {
                        params.append('forceRefresh', 'true');
                    }
                    
                    const url = `/api/dashboard/application-level${params.toString() ? '?' + params.toString() : ''}`;
                    
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status} ${response.statusText}`);
                    }
                    
                    this.data = await response.json();
                    this.render();
                    this.updateTimestamp();
                    
                } catch (error) {
                    console.error('Error loading data:', error);
                    this.showError(error.message);
                } finally {
                    this.refreshBtn.disabled = false;
                }
            }

            showLoading() {
                this.contentEl.innerHTML = `
                    <div class="loading-container">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">Loading dashboard statistics...</div>
                    </div>
                `;
            }

            showError(message) {
                this.contentEl.innerHTML = `
                    <div class="error-container">
                        <div class="error-icon">❌</div>
                        <div class="error-message">Failed to load data: ${this.escapeHtml(message)}</div>
                        <button onclick="window.dashboard.loadData()" class="refresh-btn" style="margin-top: 20px;">
                            🔄 Try Again
                        </button>
                    </div>
                `;
            }

            updateTimestamp() {
                if (this.data) {
                    const date = new Date();
                    const daysBack = this.daysFilter.value;
                    this.timestampEl.innerHTML = `
                        <strong>Last Updated:</strong> ${date.toLocaleString()} 
                        | <strong>Showing:</strong> Last ${daysBack || this.daysFilter.value} days
                    `;
                }
            }

            render() {
                if (!this.data || !this.data.categories) {
                    this.showError('No data available');
                    return;
                }

                // Transform categories data into team-like structure
                const categories = this.data.categories;
                this.transformedCategories = categories.map(cat => {
                    const tickets = cat.tickets || [];
                    const openBugs = tickets.filter(t => !this.isResolved(t.status)).length;
                    const resolvedBugs = tickets.filter(t => this.isResolved(t.status)).length;
                    const totalBugs = tickets.length;
                    const resolutionRate = totalBugs > 0 ? Math.round((resolvedBugs / totalBugs) * 100) : 0;
                    
                    return {
                        name: cat.name,
                        count: cat.count,
                        totalBugs: totalBugs,
                        openBugs: openBugs,
                        resolvedBugs: resolvedBugs,
                        resolutionRate: resolutionRate,
                        tickets: tickets
                    };
                });
                const transformedCategories = this.transformedCategories;

                // Calculate summary
                const totalBugs = transformedCategories.reduce((sum, cat) => sum + cat.totalBugs, 0);
                const totalOpen = transformedCategories.reduce((sum, cat) => sum + cat.openBugs, 0);
                const totalResolved = transformedCategories.reduce((sum, cat) => sum + cat.resolvedBugs, 0);
                const overallResolutionRate = totalBugs > 0 ? Math.round((totalResolved / totalBugs) * 100) : 0;

                const summary = {
                    totalBugs,
                    totalOpen,
                    totalResolved,
                    overallResolutionRate
                };

                this.contentEl.innerHTML = `
                    <!-- Summary Cards -->
                    <div class="summary-grid fade-in">
                        <div class="summary-card total clickable" data-status="all">

                            <div class="summary-value">${this.formatNumber(summary.totalBugs)}</div>
                            <div class="summary-label">Total Bugs</div>
                            <div class="click-hint">Click to view all</div>
                        </div>
                        <div class="summary-card open clickable" data-status="open">
                            <div class="summary-icon">🔴</div>
                            <div class="summary-value">${this.formatNumber(summary.totalOpen)}</div>
                            <div class="summary-label">Open Bugs</div>
                            <div class="click-hint">Click to view open</div>
                        </div>
                        <div class="summary-card resolved clickable" data-status="resolved">
                            <div class="summary-icon">✅</div>
                            <div class="summary-value">${this.formatNumber(summary.totalResolved)}</div>
                            <div class="summary-label">Resolved Bugs</div>
                            <div class="click-hint">Click to view closed</div>
                        </div>
                        <div class="summary-card rate">
                            <div class="summary-icon">📈</div>
                            <div class="summary-value">${summary.overallResolutionRate}%</div>
                            <div class="summary-label">Resolution Rate</div>
                        </div>
                    </div>

                    <!-- Charts Section -->
                    <section class="charts-section fade-in">
                        <h2 class="section-title">
                            <span>📊</span> Bug Analytics
                        </h2>
                        <div class="charts-grid">
                            <div class="chart-card">
                                <div class="chart-card-header">
                                    <div class="chart-title">
                                        <span>📊</span> Bugs by Category
                                    </div>
                                    <div class="chart-filter">
                                        <label for="chartTypeFilter">View:</label>
                                        <select id="chartTypeFilter">
                                            <option value="bar">Bar Chart</option>
                                            <option value="horizontalBar">Horizontal Bar</option>
                                            <option value="doughnut">Doughnut</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="chart-container">
                                    <canvas id="categoryChart"></canvas>
                                </div>
                            </div>
                            <div class="chart-card">
                                <div class="chart-card-header">
                                    <div class="chart-title">
                                        <span>🎯</span> Open vs Resolved
                                    </div>
                                    <div class="chart-filter">
                                        <label for="categoryChartFilter">Category:</label>
                                        <select id="categoryChartFilter">
                                            <option value="all">All Categories</option>
                                            ${transformedCategories.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}
                                        </select>
                                    </div>
                                </div>
                                <div class="chart-container">
                                    <canvas id="openVsResolvedChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Categories Section -->
                    <section class="teams-section">
                        <h2 class="section-title">
                            <span>📁</span> Category Performance (${transformedCategories.length} Categories)
                        </h2>
                        <div class="teams-grid">
                            ${transformedCategories.map((cat, index) => this.renderCategoryCard(cat, index)).join('')}
                        </div>
                    </section>
                `;

                // Store transformed data for charts
                this.transformedData = {
                    categories: transformedCategories,
                    summary: summary
                };

                // Add click event listeners to summary cards
                setTimeout(() => {
                    document.querySelectorAll('.summary-card.clickable').forEach(card => {
                        card.addEventListener('click', (e) => {
                            const statusType = card.dataset.status;
                            this.filterByStatus(statusType);
                        });
                    });
                    
                    // Add click event listeners to stat items in category cards
                    document.querySelectorAll('.stat-item.clickable').forEach(item => {
                        item.addEventListener('click', (e) => {
                            const categoryName = item.dataset.category;
                            const statusType = item.dataset.status;
                            this.viewCategoryDetails(categoryName, statusType);
                        });
                    });
                }, 50);

                // Animate progress bars after render
                setTimeout(() => {
                    document.querySelectorAll('.progress-fill').forEach(bar => {
                        const width = bar.dataset.width;
                        bar.style.width = width + '%';
                    });
                }, 100);

                // Render charts
                this.renderCharts();
                this.setupChartFilters();
            }

                this.renderCategoryChart();
                this.renderOpenVsResolvedChart();
            }

                                    backgroundColor: chartColors.open.bg,

                                    borderRadius: 6
                                },

                                },

                                }

                        }
                    });

            }

            renderOpenVsResolvedChart(categoryFilter = 'all') {
                const ctx = document.getElementById('openVsResolvedChart');
                if (!ctx) return;

                // Destroy existing chart
                if (this.openVsResolvedChart) {
                    this.openVsResolvedChart.destroy();
                }

                let openBugs, resolvedBugs;

                if (categoryFilter === 'all') {
                    openBugs = this.transformedData.summary.totalOpen;
                    resolvedBugs = this.transformedData.summary.totalResolved;
                } else {
                    const category = this.transformedData.categories.find(c => c.name === categoryFilter);
                    if (!category) return;
                    openBugs = category.openBugs;
                    resolvedBugs = category.resolvedBugs;
                }

                const total = openBugs + resolvedBugs;
                const openPercent = total > 0 ? ((openBugs / total) * 100).toFixed(1) : 0;
                const resolvedPercent = total > 0 ? ((resolvedBugs / total) * 100).toFixed(1) : 0;

                this.openVsResolvedChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Open Bugs', 'Resolved Bugs'],
                        datasets: [{
                            data: [openBugs, resolvedBugs],
                            backgroundColor: [
                                'rgba(239, 68, 68, 0.85)',
                                'rgba(16, 185, 129, 0.85)'
                            ],
                            borderColor: ['rgb(239, 68, 68)', 'rgb(16, 185, 129)'],
                            borderWidth: 3,
                            hoverOffset: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '60%',
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    padding: 20,
                                    usePointStyle: true,
                                    font: { size: 12, family: 'Plus Jakarta Sans', weight: '600' },
                                    generateLabels: (chart) => {
                                        const data = chart.data;
                                        return data.labels.map((label, i) => ({
                                            text: `${label}: ${data.datasets[0].data[i]} (${i === 0 ? openPercent : resolvedPercent}%)`,
                                            fillStyle: data.datasets[0].backgroundColor[i],
                                            strokeStyle: data.datasets[0].borderColor[i],
                                            lineWidth: 2,
                                            pointStyle: 'circle',
                                            hidden: false,
                                            index: i
                                        }));
                                    }
                                }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(30, 41, 59, 0.95)',
                                titleFont: { size: 13, weight: 'bold' },
                                bodyFont: { size: 12 },
                                padding: 12,
                                cornerRadius: 8,
                                callbacks: {
                                    label: (context) => {
                                        const value = context.raw;
                                        const percent = context.dataIndex === 0 ? openPercent : resolvedPercent;
                                        return `${value} bugs (${percent}%)`;
                                    }
                                }
                            }
                        }
                    },
                    plugins: [{
                        id: 'centerText',
                        beforeDraw: (chart) => {
                            const ctx = chart.ctx;
                            const centerX = (chart.chartArea.left + chart.chartArea.right) / 2;
                            const centerY = (chart.chartArea.top + chart.chartArea.bottom) / 2;

                            ctx.save();
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';

                            // Total number
                            ctx.font = 'bold 28px Plus Jakarta Sans';
                            ctx.fillStyle = '#1e293b';
                            ctx.fillText(total, centerX, centerY - 10);

                            // Label
                            ctx.font = '500 12px Plus Jakarta Sans';
                            ctx.fillStyle = '#64748b';
                            ctx.fillText('Total Bugs', centerX, centerY + 15);

                            ctx.restore();
                        }
                    }]
                });
            }

            setupChartFilters() {
                const chartTypeFilter = document.getElementById('chartTypeFilter');
                const categoryChartFilter = document.getElementById('categoryChartFilter');

                if (chartTypeFilter) {
                    chartTypeFilter.addEventListener('change', (e) => {
                        this.renderCategoryChart(e.target.value);
                    });
                }

                if (categoryChartFilter) {
                    categoryChartFilter.addEventListener('change', (e) => {
                        this.renderOpenVsResolvedChart(e.target.value);
                    });
                }
            }

            renderCategoryCard(category, index) {

            async viewCategoryDetails(categoryName, statusFilter = 'all') {
                try {
                    // Find the category data from our already loaded data
                    const category = this.transformedCategories.find(c => c.name === categoryName);
                    
                    if (!category || !category.tickets) {
                        alert('No tickets found for this category');
                        return;
                    }
                    
                    // Debug: Log first ticket to see data structure
                    if (category.tickets.length > 0) {
                        console.log('Sample ticket data:', category.tickets[0]);
                        console.log('Priority:', category.tickets[0].priority);
                        console.log('Assignee:', category.tickets[0].assignee);
                        console.log('FixVersions:', category.tickets[0].fixVersions);
                    }
                    
                    // Filter tickets based on status if needed
                    let tickets = category.tickets;
                    if (statusFilter !== 'all') {
                        if (statusFilter === 'open') {
                            tickets = tickets.filter(t => !this.isResolved(t.status));
                        } else if (statusFilter === 'resolved') {
                            tickets = tickets.filter(t => this.isResolved(t.status));
                        }
                    }
                    
                    // Prepare data for modal
                    const modalData = {
                        team: categoryName,
                        totalBugs: category.totalBugs,
                        openBugs: category.openBugs,
                        resolvedBugs: category.resolvedBugs,
                        tickets: tickets
                    };
                    
                    this.showBugListModal(modalData, statusFilter);
                    
                } catch (error) {
                    console.error('Error loading category details:', error);
                    alert('Failed to load category details: ' + error.message);
                }
            }

            async viewCategorySubSections(categoryName) {
                try {
                    // Find the category data from our already loaded data
                    const category = this.transformedCategories.find(c => c.name === categoryName);
                    
                    if (!category || !category.tickets) {
                        alert('No tickets found for this category');
                        return;
                    }
                    
                    // Check if this is EPIM category - show specific subsections
                    if (categoryName.toUpperCase() === 'EPIM') {
                        // Initialize EPIM subsections with empty ticket arrays
                        const epimSubsections = {
                            'Home widget': { name: 'Home widget', icon: '🏠', tickets: [], totalBugs: 0, openBugs: 0, resolvedBugs: 0 },
                            'Analytics': { name: 'Analytics', icon: '📊', tickets: [], totalBugs: 0, openBugs: 0, resolvedBugs: 0 },
                            'Admin': { name: 'Admin', icon: '⚙️', tickets: [], totalBugs: 0, openBugs: 0, resolvedBugs: 0 },
                            'Case': { name: 'Case', icon: '📋', tickets: [], totalBugs: 0, openBugs: 0, resolvedBugs: 0 },
                            'Others': { name: 'Others', icon: '📦', tickets: [], totalBugs: 0, openBugs: 0, resolvedBugs: 0 }
                        };
                        
                        // Helper function to check if text contains any keywords
                        const containsKeywords = (text, keywords) => {
                            if (!text) return false;
                            const lowerText = text.toLowerCase();
                            return keywords.some(keyword => lowerText.includes(keyword.toLowerCase()));
                        };
                        
                        // Assign tickets based on keyword matching in sequence
                        category.tickets.forEach(ticket => {
                            // Combine searchable fields
                            const searchText = [
                                ticket.title || '',
                                ticket.summary || '',
                                ticket.description || '',
                                ticket.component || '',
                                ticket.labels ? ticket.labels.join(' ') : ''
                            ].join(' ');
                            
                            let assigned = false;
                            
                            // 1. Check Home Widget keywords
                            if (!assigned && containsKeywords(searchText, ['home', 'widget'])) {
                                epimSubsections['Home widget'].tickets.push(ticket);
                                epimSubsections['Home widget'].totalBugs++;
                                if (this.isResolved(ticket.status)) {
                                    epimSubsections['Home widget'].resolvedBugs++;
                                } else {
                                    epimSubsections['Home widget'].openBugs++;
                                }
                                assigned = true;
                            }
                            
                            // 2. Check Analytics keywords
                            if (!assigned && containsKeywords(searchText, ['premium analytics', 'custom ad hoc report', 'analytics', 'logi', 'preformatted summary', 'PA Logi reports'])) {
                                epimSubsections['Analytics'].tickets.push(ticket);
                                epimSubsections['Analytics'].totalBugs++;
                                if (this.isResolved(ticket.status)) {
                                    epimSubsections['Analytics'].resolvedBugs++;
                                } else {
                                    epimSubsections['Analytics'].openBugs++;
                                }
                                assigned = true;
                            }
                            
                            // 3. Check Admin keywords
                            if (!assigned && containsKeywords(searchText, ['case admin', 'priority keywords', 'users', 'notifications', 'custom field', 'Case Template'])) {
                                epimSubsections['Admin'].tickets.push(ticket);
                                epimSubsections['Admin'].totalBugs++;
                                if (this.isResolved(ticket.status)) {
                                    epimSubsections['Admin'].resolvedBugs++;
                                } else {
                                    epimSubsections['Admin'].openBugs++;
                                }
                                assigned = true;
                            }
                            
                            // 4. Check Case keywords
                            if (!assigned && containsKeywords(searchText, ['case', 'synopsis', 'participants', 'notes', 'attachment'])) {
                                epimSubsections['Case'].tickets.push(ticket);
                                epimSubsections['Case'].totalBugs++;
                                if (this.isResolved(ticket.status)) {
                                    epimSubsections['Case'].resolvedBugs++;
                                } else {
                                    epimSubsections['Case'].openBugs++;
                                }
                                assigned = true;
                            }
                            
                            // 5. If not assigned to any category, put in Others
                            if (!assigned) {
                                epimSubsections['Others'].tickets.push(ticket);
                                epimSubsections['Others'].totalBugs++;
                                if (this.isResolved(ticket.status)) {
                                    epimSubsections['Others'].resolvedBugs++;
                                } else {
                                    epimSubsections['Others'].openBugs++;
                                }
                            }
                        });
                        
                        // Convert to array in the desired order
                        const subsectionArray = [
                            epimSubsections['Home widget'],
                            epimSubsections['Analytics'],
                            epimSubsections['Admin'],
                            epimSubsections['Case'],
                            epimSubsections['Others']
                        ];
                        
                        this.showSubSectionsModal(categoryName, subsectionArray, true);
                        return;
                    }
                    
                    // For non-EPIM categories, group tickets by component/subsection
                    const subsections = {};
                    category.tickets.forEach(ticket => {
                        const component = ticket.component || 'Unassigned';
                        if (!subsections[component]) {
                            subsections[component] = {
                                name: component,
                                tickets: [],
                                totalBugs: 0,
                                openBugs: 0,
                                resolvedBugs: 0
                            };
                        }
                        subsections[component].tickets.push(ticket);
                        subsections[component].totalBugs++;
                        if (this.isResolved(ticket.status)) {
                            subsections[component].resolvedBugs++;
                        } else {
                            subsections[component].openBugs++;
                        }
                    });
                    
                    // Convert to array and sort by total bugs
                    const subsectionArray = Object.values(subsections).sort((a, b) => b.totalBugs - a.totalBugs);
                    
                    // Show modal with subsections
                    this.showSubSectionsModal(categoryName, subsectionArray, false);
                    
                } catch (error) {
                    console.error('Error loading category subsections:', error);
                    alert('Failed to load category subsections: ' + error.message);
                }

                if (s.includes('progress') || s.includes('review')) return '#f59e0b';
                if (s.includes('open') || s.includes('new') || s.includes('todo')) return '#ef4444';
                return '#64748b';

            isResolved(status) {
                if (!status) return false;
                const s = status.toLowerCase();
                return s.includes('done') || s.includes('closed') || s.includes('resolved');
            }

                // Collect all tickets from all categories
                const allTickets = [];
                if (this.transformedCategories) {

                        }
                    });

                let filteredTickets = [];
                let modalTitle = '';
                let modalIcon = '🐛';
                let statusFilter = 'all';

                if (statusType === 'all') {
                    filteredTickets = allTickets;
                    modalTitle = 'All Bugs';
                    modalIcon = '🐛';
                } else if (statusType === 'open') {
                    filteredTickets = allTickets.filter(t => !this.isResolved(t.status));
                    modalTitle = 'Open Bugs';
                    modalIcon = '🔴';
                    statusFilter = 'open';
                } else if (statusType === 'resolved') {
                    filteredTickets = allTickets.filter(t => this.isResolved(t.status));
                    modalTitle = 'Resolved Bugs';
                    modalIcon = '✅';
                    statusFilter = 'resolved';

                // Calculate open and resolved counts
                const openCount = allTickets.filter(t => !this.isResolved(t.status)).length;
                const resolvedCount = allTickets.filter(t => this.isResolved(t.status)).length;

                // Show the filtered bugs modal (similar to CMI Dashboard approach)
                this.showFilteredBugsModal(filteredTickets, modalTitle, modalIcon, statusFilter, allTickets.length, openCount, resolvedCount);
            }

            showFilteredBugsModal(tickets, title, icon, statusFilter, totalBugs, openBugs, resolvedBugs) {
                const modal = document.createElement('div');
                modal.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background: rgba(0,0,0,0.8);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 1000;
                    padding: 20px;
                    animation: fadeIn 0.3s ease;
                `;

                const headerBg = statusFilter === 'open' 
                    ? 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)'
                    : statusFilter === 'resolved'
                        ? 'linear-gradient(135deg, #10b981 0%, #059669 100%)'
                        : 'linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%)';

                const allTickets = [...tickets];
                let filteredTickets = [...tickets];

                modal.innerHTML = `
                    <div style="
                        background: white;
                        border-radius: 20px;
                        max-width: 1400px;
                        width: 100%;
                        max-height: 90vh;
                        overflow: hidden;
                        display: flex;
                        flex-direction: column;
                    ">
                        <div style="
                            padding: 24px;
                            background: ${headerBg};
                            color: white;
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                        ">
                            <div>
                                <h2 style="margin: 0; font-size: 1.5rem;">${icon} ${title}</h2>
                                <p style="margin: 5px 0 0 0; opacity: 0.9;">
                                    <span id="filteredModalTicketCount">
                                        ${tickets.length} tickets across all applications${this.getTimeRangeText()}
                                    </span>
                                </p>
                            </div>
                            <button onclick="this.closest('div').parentElement.parentElement.remove()" style="
                                background: rgba(255,255,255,0.2);
                                border: none;
                                color: white;
                                width: 40px;
                                height: 40px;
                                border-radius: 10px;
                                cursor: pointer;
                                font-size: 1.5rem;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                            ">×</button>
                        </div>

                        <!-- Search and Filter Section -->
                        <div style="padding: 20px; background: #f8f9fa; border-bottom: 2px solid #e2e8f0;">
                            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                                <input type="text" id="filteredSearchInput" placeholder="🔍 Search ticket #, title, assignee..." style="
                                    padding: 10px 15px;
                                    border: 2px solid #cbd5e1;
                                    border-radius: 8px;
                                    font-size: 0.95rem;
                                    outline: none;
                                ">
                                <select id="filteredStatusFilter" style="
                                    padding: 10px 15px;
                                    border: 2px solid #cbd5e1;
                                    border-radius: 8px;
                                    font-size: 0.95rem;
                                    cursor: pointer;
                                ">
                                    <option value="">All Statuses</option>
                                </select>
                                <select id="filteredPriorityFilter" style="
                                    padding: 10px 15px;
                                    border: 2px solid #cbd5e1;
                                    border-radius: 8px;
                                    font-size: 0.95rem;
                                    cursor: pointer;
                                ">
                                    <option value="">All Priorities</option>
                                </select>
                                <select id="filteredAssigneeFilter" style="
                                    padding: 10px 15px;
                                    border: 2px solid #cbd5e1;
                                    border-radius: 8px;
                                    font-size: 0.95rem;
                                    cursor: pointer;
                                ">
                                    <option value="">All Assignees</option>
                                </select>
                            </div>
                            <button id="filteredClearFilters" style="
                                padding: 8px 16px;
                                background: white;
                                border: 2px solid #cbd5e1;
                                border-radius: 8px;
                                font-size: 0.9rem;
                                cursor: pointer;
                            ">Clear Filters</button>
                        </div>

                        <!-- Table Container -->
                        <div style="flex: 1; overflow-y: auto; padding: 0;">
                            <table style="width: 100%; border-collapse: collapse;">
                                <thead style="position: sticky; top: 0; background: #f1f5f9; z-index: 10;">
                                    <tr>
                                        <th style="padding: 15px; text-align: left; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0;">Ticket</th>
                                        <th style="padding: 15px; text-align: left; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0;">Title</th>
                                        <th style="padding: 15px; text-align: left; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0;">Status</th>
                                        <th style="padding: 15px; text-align: left; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0;">Priority</th>
                                        <th style="padding: 15px; text-align: left; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0;">Assignee</th>
                                        <th style="padding: 15px; text-align: left; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0;">Fix Version</th>
                                        <th style="padding: 15px; text-align: left; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0;">Created</th>
                                    </tr>
                                </thead>
                                <tbody id="filteredTableBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                document.body.appendChild(modal);

                // Get filter elements
                const searchInput = modal.querySelector('#filteredSearchInput');
                const statusFilterSelect = modal.querySelector('#filteredStatusFilter');
                const priorityFilterSelect = modal.querySelector('#filteredPriorityFilter');
                const assigneeFilterSelect = modal.querySelector('#filteredAssigneeFilter');
                const clearFiltersBtn = modal.querySelector('#filteredClearFilters');
                const tableBody = modal.querySelector('#filteredTableBody');
                const ticketCountSpan = modal.querySelector('#filteredModalTicketCount');

                // Populate filter options
                const statuses = [...new Set(allTickets.map(t => t.status).filter(Boolean))];
                const priorities = [...new Set(allTickets.map(t => t.priority).filter(Boolean))];
                const assignees = [...new Set(allTickets.map(t => t.assignee).filter(Boolean))];

                statuses.forEach(s => {
                    const option = document.createElement('option');
                    option.value = s;
                    option.textContent = s;
                    statusFilterSelect.appendChild(option);
                });

                priorities.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p;
                    option.textContent = p;
                    priorityFilterSelect.appendChild(option);
                });

                assignees.forEach(a => {
                    const option = document.createElement('option');
                    option.value = a;
                    option.textContent = a;
                    assigneeFilterSelect.appendChild(option);
                });

                // Render table function
                const renderTable = (ticketsToRender) => {
                    if (ticketsToRender.length > 0) {
                        tableBody.innerHTML = ticketsToRender.map(ticket => `
                            <tr style="border-bottom: 1px solid #e2e8f0; transition: background 0.2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='white'">
                                <td style="padding: 12px 15px;">
                                    <a href="https://navex.atlassian.net/browse/${ticket.ticketKey}" target="_blank" style="color: #6366f1; font-weight: 600; text-decoration: none;">${ticket.ticketKey}</a>
                                </td>
                                <td style="padding: 12px 15px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${this.escapeHtml(ticket.title || '')}">${this.escapeHtml(ticket.title || 'No title')}</td>
                                <td style="padding: 12px 15px;">
                                    <span style="padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; background: ${this.getStatusColor(ticket.status)}; color: white;">${ticket.status || 'N/A'}</span>
                                </td>
                                <td style="padding: 12px 15px; color: #64748b;">${ticket.priority || 'N/A'}</td>
                                <td style="padding: 12px 15px; color: #64748b;">${ticket.assignee || 'Unassigned'}</td>
                                <td style="padding: 12px 15px;">
                                    <span style="padding: 4px 10px; border-radius: 15px; font-size: 0.8rem; background: #e0e7ff; color: #4338ca;">${ticket.fixVersions && ticket.fixVersions.length > 0 ? ticket.fixVersions[0] : 'N/A'}</span>
                                </td>
                                <td style="padding: 12px 15px; color: #64748b;">${this.formatDate(ticket.createdDate)}</td>
                            </tr>
                        `).join('');
                    } else {
                        tableBody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px; color: #666;">No tickets match the current filters.</td></tr>';
                    }
                };

                // Apply filters function
                const applyFilters = () => {
                    const searchTerm = searchInput.value.toLowerCase();
                    const statusValue = statusFilterSelect.value;
                    const priorityValue = priorityFilterSelect.value;
                    const assigneeValue = assigneeFilterSelect.value;

                    filteredTickets = allTickets.filter(ticket => {
                        const matchesSearch = !searchTerm || 
                            (ticket.ticketKey && ticket.ticketKey.toLowerCase().includes(searchTerm)) ||
                            (ticket.title && ticket.title.toLowerCase().includes(searchTerm)) ||
                            (ticket.assignee && ticket.assignee.toLowerCase().includes(searchTerm));
                        const matchesStatus = !statusValue || ticket.status === statusValue;
                        const matchesPriority = !priorityValue || ticket.priority === priorityValue;
                        const matchesAssignee = !assigneeValue || ticket.assignee === assigneeValue;
                        return matchesSearch && matchesStatus && matchesPriority && matchesAssignee;
                    });

                    // Update count
                    const timeRangeText = this.getTimeRangeText();
                    if (filteredTickets.length !== allTickets.length) {
                        ticketCountSpan.textContent = `Showing ${filteredTickets.length} of ${allTickets.length} tickets (filtered)${timeRangeText}`;
                    } else {
                        ticketCountSpan.textContent = `${tickets.length} tickets across all applications${timeRangeText}`;
                    }

                    renderTable(filteredTickets);
                };

                // Initial render
                renderTable(filteredTickets);

                // Add event listeners
                searchInput.addEventListener('input', applyFilters);
                statusFilterSelect.addEventListener('change', applyFilters);
                priorityFilterSelect.addEventListener('change', applyFilters);
                assigneeFilterSelect.addEventListener('change', applyFilters);

                clearFiltersBtn.addEventListener('click', () => {
                    searchInput.value = '';
                    statusFilterSelect.value = '';
                    priorityFilterSelect.value = '';
                    assigneeFilterSelect.value = '';
                    applyFilters();
                });

                // Close on backdrop click
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        modal.remove();
                    }
                });

                // Close on Escape key
                const handleEscape = (e) => {
                    if (e.key === 'Escape') {
                        modal.remove();
                        document.removeEventListener('keydown', handleEscape);
                    }
                };
                document.addEventListener('keydown', handleEscape);
            }

            getTimeRangeText() {
                if (this.daysFilter.value === 'custom' && this.startDateInput.value && this.endDateInput.value) {
                    return ` | ${this.startDateInput.value} to ${this.endDateInput.value}`;
                } else if (this.daysFilter.value) {
                    return ` | Last ${this.daysFilter.value} days`;
                }
                return '';
            }

            formatNumber(num) {
                if (num >= 1000) {
                    return (num / 1000).toFixed(1) + 'K';
                }
                return num.toString();
            }

            formatDate(dateString) {
                if (!dateString) return 'N/A';
                try {
                    const date = new Date(dateString);
                    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                } catch {
                    return 'N/A';
                }
            }

            escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', () => {
            window.dashboard = new ApplicationDashboard();
        });
    </script>
</body>
</html>
